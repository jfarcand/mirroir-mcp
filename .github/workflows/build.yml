name: Build

on:
  push:
    # Every branch, not just main: this repo squash-merges locally and opens no
    # pull requests of its own, so a feature branch has no other way to reach
    # these lanes before it lands. `branches-ignore` rather than deleting the
    # key — a push trigger that names `tags` and omits `branches` entirely fires
    # ONLY on tags, which would disable branch CI outright. Dependabot is
    # excluded because it pushes its branch AND opens a PR; the two land in
    # different concurrency groups, so the push run is a pure duplicate.
    branches-ignore: ['dependabot/**']
    # Path filters ARE evaluated for tag pushes, against the tagged commit's own
    # diff. release.yml tags its "chore: bump version" commit, which writes
    # Sources/mirroir-mcp/Version.swift — so `Sources/**` keeps this lane firing
    # on releases.
    tags: ['v*']
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/**'
      # mirroir-run hands ios blocks to this binary: the both-toolchains step
      # below runs the runner against it, so a runner change reruns it too.
      - 'runner/**'
      - '.github/actions/setup-embacle/**'
      - '.github/actions/setup-fake-mirroring/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    # Same list as `push` — the Actions parser has no YAML anchors, so it is
    # repeated (as in runner.yml and limitation-register.yml). Without it every
    # dependabot bump for /website, /runner or /npm burns both macOS jobs on
    # code this workflow never compiles.
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/**'
      # mirroir-run hands ios blocks to this binary: the both-toolchains step
      # below runs the runner against it, so a runner change reruns it too.
      - 'runner/**'
      - '.github/actions/setup-embacle/**'
      - '.github/actions/setup-fake-mirroring/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Cancel superseded runs to save the scarce macOS runner slots. Keyed on
# `head_ref || ref` so a branch push and the pull request for it share one group.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    # The job takes ~40 min; twice that is a hang, not a slow runner.
    timeout-minutes: 80
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-embacle

      - name: Clone skills repo
        run: |
          git clone https://github.com/jfarcand/mirroir-skills.git ../mirroir-skills
          mkdir -p .mirroir-mcp
          ln -s "$(cd ../mirroir-skills && pwd)" .mirroir-mcp/skills

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Unit tests (XCTest)
        timeout-minutes: 15
        run: swift test --skip IntegrationTests --disable-swift-testing

      - name: Unit tests (Swift Testing)
        timeout-minutes: 5
        run: swift test --skip IntegrationTests --disable-xctest --no-parallel

      - uses: ./.github/actions/setup-fake-mirroring
      - name: Pre-test runner diagnostics
        run: |
          echo "=== sw_vers ==="
          sw_vers
          echo ""
          echo "=== uname ==="
          uname -a
          echo ""
          echo "=== ioreg display ==="
          ioreg -l -w 0 -d 0 -p IODisplayWrangler 2>/dev/null | head -40 || true
          echo ""
          echo "=== displayplacer / displays ==="
          system_profiler SPDisplaysDataType 2>/dev/null | head -40 || true
          echo ""
          echo "=== ps for FakeMirroring ==="
          ps -ef | grep -i FakeMirroring | grep -v grep || echo "FakeMirroring not yet running"
          echo ""
          echo "=== pmset -g ==="
          pmset -g 2>/dev/null | head -20 || true
          echo ""
          echo "=== AX/Input Monitoring TCC (read-only check) ==="
          ls -l /Library/Application\ Support/com.apple.TCC/TCC.db 2>/dev/null || echo "no system TCC.db readable"

      - name: Integration tests (FakeMirroring)
        env:
          MIRROIR_BUNDLE_ID: com.jfarcand.FakeMirroring
          MIRROIR_PROCESS_NAME: FakeMirroring
        run: swift test --filter IntegrationTests

      - name: Post-test runner diagnostics (on failure)
        if: failure()
        run: |
          echo "=== ps for FakeMirroring after tests ==="
          ps -ef | grep -i FakeMirroring | grep -v grep || echo "FakeMirroring not running"
          echo ""
          echo "=== CGWindowList via osascript ==="
          osascript -e 'tell application "System Events" to get every process whose visible is true' 2>&1 | head -10 || true
          echo ""
          echo "=== FakeMirroring NSLog output (last 10 min, full) ==="
          log show --last 10m --predicate 'process == "FakeMirroring"' --info --debug 2>&1 | grep -E "fakemirror-tap|FakeMirroring\]" | tail -200 || true
          echo ""
          echo "=== WindowServer log (last 5 min) ==="
          log show --last 5m --predicate 'subsystem == "com.apple.WindowServer"' --info 2>&1 | tail -100 || true
          echo ""
          echo "=== HIToolbox / event tap log (last 5 min) ==="
          log show --last 5m --predicate 'subsystem == "com.apple.HIToolbox" OR subsystem == "com.apple.coreservices"' --info 2>&1 | tail -50 || true

      - name: Test runner (FakeMirroring)
        env:
          MIRROIR_BUNDLE_ID: com.jfarcand.FakeMirroring
          MIRROIR_PROCESS_NAME: FakeMirroring
        run: |
          set -euo pipefail
          .build/release/mirroir-mcp test --junit test-results.xml --verbose Tests/Fixtures/skills/fake-mirroring-check.yaml 2>&1 | tee test-runner.log
          # Every capture must come from ScreenCaptureKit: a fallback to the
          # screencapture CLI is a degraded capture path, even when steps pass.
          grep -qE "capture: sck=[1-9][0-9]* fallback=0$" test-runner.log \
            || { echo "capture fell back to the screencapture CLI:"; grep "capture:" test-runner.log; exit 1; }

      - name: Compile skill (FakeMirroring)
        env:
          MIRROIR_BUNDLE_ID: com.jfarcand.FakeMirroring
          MIRROIR_PROCESS_NAME: FakeMirroring
        run: |
          .build/release/mirroir-mcp compile Tests/Fixtures/skills/fake-mirroring-compiled.yaml

      - name: Test compiled skill (FakeMirroring)
        env:
          MIRROIR_BUNDLE_ID: com.jfarcand.FakeMirroring
          MIRROIR_PROCESS_NAME: FakeMirroring
        run: |
          .build/release/mirroir-mcp test --verbose Tests/Fixtures/skills/fake-mirroring-compiled.yaml

      # Both toolchains in one job: the Swift server built above, and the Rust
      # runner that hands it an ios block. This is the only lane where a change
      # on either side of that boundary meets the other — the report format,
      # the target map, the block dialect, the live capture.
      - name: Install Rust toolchain (runner)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      # mirroir-run kills a hung block at the budget its steps earn; the step
      # bound also covers the runner's own build, so CI can never hang here.
      - name: mirroir-run → mirroir-mcp ios block (FakeMirroring)
        timeout-minutes: 15
        working-directory: runner
        env:
          MIRROIR_BUNDLE_ID: com.jfarcand.FakeMirroring
          MIRROIR_PROCESS_NAME: FakeMirroring
          MIRROIR_MCP_BIN: ${{ github.workspace }}/.build/release/mirroir-mcp
          # The global drift-defaults.yaml layer the runner requires, from the
          # skills clone made at the top of this job.
          MIRROIR_SKILLS: ${{ github.workspace }}/../mirroir-skills
          # mirroir-mcp's stderr reaches the log only at debug on a passing
          # block; the capture summary below is read from it.
          RUST_LOG: info,mirroir_run::target::ios=debug
        run: |
          set -euo pipefail
          cargo build --locked
          ./target/debug/mirroir-run --sample samples/ios-fixture 2>&1 | tee ios-fixture.log
          # A skipped block must not pass as green: the run has to show the
          # hand-off, the live capture, and the comparison it fed.
          plain=$(sed 's/\x1b\[[0-9;]*m//g' ios-fixture.log)
          for marker in \
              "dispatching the scenario's ios block to mirroir-mcp" \
              "cross_surface capture written" \
              "cross_surface pairwise check" \
              "verdict=pass"; do
            grep -qF "$marker" <<<"$plain" || { echo "missing: $marker"; exit 1; }
          done
          # Every screen capture went through ScreenCaptureKit: a fallback to
          # the screencapture CLI is the stall carnet#24 hides behind a pass,
          # and zero SCK captures would mean the block read no screen at all.
          # No MCP server runs here, so nothing shares replayd's per-binary
          # client slot with this run (see WindowShotFailure.handlerDropped).
          grep -qE "capture: sck=[1-9][0-9]* fallback=0" <<<"$plain" \
            || { echo "missing: capture: sck=N fallback=0"; exit 1; }

      # The emitter → runner contract, end to end: explore the Clock pack on
      # FakeMirroring with emit=true into a scratch consumer repo, then replay
      # what was written through mirroir-run → mirroir-mcp. ios-fixture above is
      # hand-written; this is the one lane where an EMITTED scenario — tap and
      # wait_for included — crosses both binaries. The Clock pack is read from
      # mirroir-skills' default branch, so a pack edit there can turn this red.
      #
      # Determinism: heuristic component detection (no LLM classifier), the
      # embedded embacle runner off (so the BFS advisor is the heuristic one,
      # not a vision model), local OCR as the describer, and a fixed seed.
      - name: generate_skill emits the Clock scenario (FakeMirroring)
        timeout-minutes: 10
        env:
          MIRROIR_BUNDLE_ID: com.jfarcand.FakeMirroring
          MIRROIR_PROCESS_NAME: FakeMirroring
          MIRROIR_COMPONENT_DETECTION: heuristic
          MIRROIR_AGENT_TRANSPORT: http
          MIRROIR_SCREEN_DESCRIBER_MODE: ocr
          CONTRACT_DIR: ${{ runner.temp }}/clock-contract
        run: |
          set -euo pipefail
          CONSUMER="$CONTRACT_DIR/consumer"
          mkdir -p "$CONSUMER/.mirroir"
          BIN="$PWD/.build/release/mirroir-mcp"
          call() {  # call <id> <tool> <arguments-json>
            python3 -c 'import json,sys; print(json.dumps({"jsonrpc":"2.0","id":int(sys.argv[1]),"method":"tools/call","params":{"name":sys.argv[2],"arguments":json.loads(sys.argv[3])}}))' "$@"
          }
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
          # press_home first: the Settings fixture above leaves Settings in
          # the foreground, and the exploration must start from a cold Clock.
          explore_args=$(python3 -c 'import json,sys; print(json.dumps({"action":"explore","app_name":"Clock","emit":True,"output_dir":sys.argv[1],"max_depth":2,"max_screens":4,"max_time":120,"seed":42,"fresh":True}))' "$CONSUMER")
          # stdin closes after the last request, so the server answers the
          # explore and exits: the pipeline below returns only once it has.
          printf '%s\n' "$init" "$(call 2 press_home '{}')" "$(call 3 generate_skill "$explore_args")" \
            | "$BIN" --dangerously-skip-permissions 2>"$CONTRACT_DIR/explore-server.log" \
            > "$CONTRACT_DIR/explore-responses.jsonl"
          python3 - "$CONTRACT_DIR/explore-responses.jsonl" <<'EOF'
          import json, sys
          replies = {m.get("id"): m for m in map(json.loads, filter(str.strip, open(sys.argv[1])))}
          for rid, tool in ((2, "press_home"), (3, "generate_skill")):
              reply = replies.get(rid)
              assert reply and "result" in reply, f"{tool}: no result: {reply}"
              text = "\n".join(c.get("text", "") for c in reply["result"]["content"])
              print(f"--- {tool} ---\n{text}")
              assert not reply["result"].get("isError"), f"{tool} returned isError"
          assert "Emitted .mirroir/ iOS leg" in text, "explore finished without emitting the .mirroir/ leg"
          EOF
          APP_DIR="$CONSUMER/.mirroir/apps/clock"
          test -f "$APP_DIR/SAMPLE.md" || { echo "no SAMPLE.md under $APP_DIR"; exit 1; }
          scenarios=$(find "$APP_DIR/scenarios" -name '*.ios.yaml' 2>/dev/null | sort)
          [ -n "$scenarios" ] || { echo "no scenario written under $APP_DIR/scenarios"; exit 1; }
          for scenario in $scenarios; do echo "=== $scenario ==="; cat "$scenario"; done
          # shellcheck disable=SC2086
          grep -qE '^  - tap: ' $scenarios || { echo "no emitted scenario carries a tap: step"; exit 1; }
          # replayd keys ScreenCaptureKit clients by executable path: a server
          # of this binary still alive would knock the replay's captures off
          # (carnet#24). The pipeline above waited for it; prove it.
          if pgrep -fl "$BIN"; then echo "mirroir-mcp server still running"; exit 1; fi
          # A launch of a running app resumes where it was left, so every
          # emitted flow opens `reset_app: Clock` then `launch: Clock` and
          # replays from the root screen it was recorded from — the explore
          # above leaves Clock running wherever it stopped.
          for scenario in $scenarios; do
            grep -qzE '\n  - reset_app: "Clock"\n  - launch: "Clock"\n' "$scenario" \
              || { echo "$scenario does not open with reset_app then launch of Clock"; exit 1; }
          done

      - name: mirroir-run replays the emitted Clock scenario (FakeMirroring)
        timeout-minutes: 10
        working-directory: runner
        env:
          MIRROIR_BUNDLE_ID: com.jfarcand.FakeMirroring
          MIRROIR_PROCESS_NAME: FakeMirroring
          MIRROIR_MCP_BIN: ${{ github.workspace }}/.build/release/mirroir-mcp
          # The global drift-defaults.yaml layer the runner requires, from the
          # skills clone made at the top of this job.
          MIRROIR_SKILLS: ${{ github.workspace }}/../mirroir-skills
          # mirroir-mcp's stderr — the step counts and the capture summary —
          # reaches the log only at debug on a passing block.
          RUST_LOG: info,mirroir_run::target::ios=debug
          CONTRACT_DIR: ${{ runner.temp }}/clock-contract
        run: |
          set -euo pipefail
          APP_DIR="$CONTRACT_DIR/consumer/.mirroir/apps/clock"
          # The ios blocks land under target/mirroir-ios/<sample>/<scenario>/.
          BLOCKS=target/mirroir-ios/clock
          rm -rf "$BLOCKS"
          ./target/debug/mirroir-run --sample "$APP_DIR" 2>&1 | tee "$CONTRACT_DIR/clock-replay.log"
          plain=$(sed 's/\x1b\[[0-9;]*m//g' "$CONTRACT_DIR/clock-replay.log")
          for marker in \
              "dispatching the scenario's ios block to mirroir-mcp" \
              "verdict=pass"; do
            grep -qF "$marker" <<<"$plain" || { echo "missing: $marker"; exit 1; }
          done
          grep -qE "capture: sck=[1-9][0-9]* fallback=0" <<<"$plain" \
            || { echo "missing: capture: sck=N fallback=0"; exit 1; }
          grep -E "capture: sck=[0-9]+ fallback=[1-9]" <<<"$plain" \
            && { echo "a block fell back to the screencapture CLI"; exit 1; }
          # Every emitted step ran and passed: the Playwright report carries
          # no per-step results, so the proof is mirroir-mcp's own summary —
          # one per scenario, every step PASSED (the opening target: and the
          # own-app reset_app: included, both steps mirroir-mcp executes; the
          # reset needs no --confirm-destructive), none failed, skipped or left
          # unevaluated — and an ios block that kept the reset, tap and wait_for.
          python3 - "$CONTRACT_DIR/clock-replay.log" "$APP_DIR/scenarios" "$BLOCKS" <<'EOF'
          import pathlib, re, sys
          log, scenarios_dir, blocks_dir = sys.argv[1], pathlib.Path(sys.argv[2]), pathlib.Path(sys.argv[3])
          text = re.sub(r"\x1b\[[0-9;]*m", "", open(log, encoding="utf-8", errors="replace").read())
          step = re.compile(r"^  - ", re.M)
          scenarios = sorted(scenarios_dir.glob("*.ios.yaml"))
          emitted = sum(len(step.findall(s.read_text())) for s in scenarios)
          summaries = re.findall(
              r"Steps — PASSED: (\d+), FAILED: (\d+), NOT EVALUATED: (\d+), SKIPPED: (\d+)", text)
          print(f"{len(scenarios)} emitted scenario(s), {emitted} step(s); summaries: {summaries}")
          assert len(summaries) == len(scenarios), \
              f"expected one mirroir-mcp summary per scenario, found {len(summaries)}"
          for passed, failed, not_evaluated, skipped in summaries:
              assert (failed, not_evaluated, skipped) == ("0", "0", "0"), \
                  f"a step did not pass: FAILED {failed}, NOT EVALUATED {not_evaluated}, SKIPPED {skipped}"
          passed = sum(int(s[0]) for s in summaries)
          assert passed == emitted, f"PASSED {passed} != emitted steps {emitted}"
          blocks = sorted(blocks_dir.glob("*/ios-block.yaml"))
          assert len(blocks) == len(scenarios), f"{len(blocks)} ios block(s) for {len(scenarios)} scenario(s)"
          rendered = "".join(b.read_text() for b in blocks)
          for verb in ("reset_app:", "tap:", "wait_for:"):
              assert f"  - {verb} " in rendered, f"no ios block carried a {verb} step across the bridge"
          print("emitted Clock scenarios replayed: every step passed, reset_app, tap and wait_for crossed")
          EOF

      - name: Upload emitted Clock contract
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clock-emit-contract
          # The emitted tree lives under .mirroir/, which upload-artifact
          # leaves out unless hidden files are asked for.
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/clock-contract/
            runner/target/mirroir-ios/clock/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-runner-results
          path: |
            test-results.xml
            mirroir-test-results/

      - name: Binary info
        run: |
          ls -lh .build/release/mirroir-mcp
          file .build/release/mirroir-mcp

      - name: Test MCP initialize
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | .build/release/mirroir-mcp 2>/dev/null \
            | python3 -c "
          import sys, json
          obj = json.loads(sys.stdin.readline())
          assert obj['result']['serverInfo']['name'] == 'mirroir-mcp'
          assert obj['result']['protocolVersion'] == '2025-11-25', f'Expected protocol version 2025-11-25, got: {obj[\"result\"][\"protocolVersion\"]}'
          print('MCP initialize: OK (protocol version 2025-11-25)')
          "

      - name: Test tools/list
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' \
            | .build/release/mirroir-mcp --dangerously-skip-permissions 2>/dev/null \
            | python3 -c "
          import sys, json
          lines = sys.stdin.readlines()
          obj = json.loads(lines[1])
          tools = [t['name'] for t in obj['result']['tools']]
          expected = {'screenshot','start_recording','stop_recording','tap','swipe','drag','type_text','press_key','long_press','double_tap','touch','pinch','rotate','hold_keys','shake','launch_app','open_url','press_home','press_app_switcher','press_back','spotlight','get_orientation','status','check_health','describe_screen','list_skills','get_skill','scroll_to','reset_app','measure','set_network','list_targets','switch_target','record_step','save_compiled','generate_skill','calibrate_component','classify_screen'}
          assert set(tools) == expected, f'Expected: {expected}\nGot: {set(tools)}\nMissing: {expected - set(tools)}\nExtra: {set(tools) - expected}'
          print(f'tools/list: {len(tools)} tools registered')
          "

      - name: Test tool schemas
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' \
            | .build/release/mirroir-mcp --dangerously-skip-permissions 2>/dev/null \
            | python3 -c "
          import sys, json
          lines = sys.stdin.readlines()
          obj = json.loads(lines[1])
          tools = {t['name']: t for t in obj['result']['tools']}

          # tap requires x and y
          tap = tools['tap']['inputSchema']
          assert 'x' in tap['properties'], 'tap missing x'
          assert 'y' in tap['properties'], 'tap missing y'
          assert set(tap.get('required', [])) == {'x', 'y'}, 'tap should require x and y'

          # swipe requires from_x, from_y, to_x, to_y
          swipe = tools['swipe']['inputSchema']
          assert all(k in swipe['properties'] for k in ['from_x','from_y','to_x','to_y']), 'swipe missing coords'

          # type_text requires text
          tt = tools['type_text']['inputSchema']
          assert 'text' in tt['properties'], 'type_text missing text'

          # screenshot has no required params
          ss = tools['screenshot']['inputSchema']
          assert ss.get('required', []) == [] or 'properties' not in ss or len(ss['properties']) == 0

          print('Tool schemas: OK')
          "

      - name: Test fail-closed default (readonly only)
        run: |
          # Run from a scratch directory granting nothing. The policy reads the
          # project-local config ahead of the global one, so the question stays
          # "granted nothing, what is exposed?" whether or not the machine
          # running this has a permissions file of its own.
          FAILCLOSED=$(mktemp -d)
          mkdir -p "$FAILCLOSED/.mirroir-mcp"
          echo '{}' > "$FAILCLOSED/.mirroir-mcp/permissions.json"
          BIN="$PWD/.build/release/mirroir-mcp"
          (cd "$FAILCLOSED" && printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' \
            | "$BIN" 2>/dev/null) \
            | python3 -c "
          import sys, json
          lines = sys.stdin.readlines()
          obj = json.loads(lines[1])
          tools = [t['name'] for t in obj['result']['tools']]
          expected_readonly = {'screenshot','start_recording','stop_recording','get_orientation','status','check_health','describe_screen','list_skills','get_skill','list_targets','calibrate_component','classify_screen'}
          assert set(tools) == expected_readonly, f'Fail-closed should show only readonly tools.\nExpected: {expected_readonly}\nGot: {set(tools)}\nExtra: {set(tools) - expected_readonly}\nMissing: {expected_readonly - set(tools)}'
          print(f'Fail-closed default: {len(tools)} readonly tools (OK)')
          "

      - name: Test --yolo alias matches --dangerously-skip-permissions
        run: |
          # The step tests that the two flags are aliases, so it compares them
          # against each other rather than restating the roster — a count here
          # would need updating on every tool added, in a file no local check
          # reads.
          REQUESTS='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n'
          printf "$REQUESTS" | .build/release/mirroir-mcp --yolo 2>/dev/null | tail -1 > /tmp/yolo.json
          printf "$REQUESTS" | .build/release/mirroir-mcp --dangerously-skip-permissions 2>/dev/null | tail -1 > /tmp/skip.json
          python3 -c "
          import json
          yolo = {t['name'] for t in json.load(open('/tmp/yolo.json'))['result']['tools']}
          skip = {t['name'] for t in json.load(open('/tmp/skip.json'))['result']['tools']}
          assert yolo, '--yolo exposed no tools'
          assert yolo == skip, f'--yolo differs from --dangerously-skip-permissions: {yolo ^ skip}'
          print(f'--yolo alias: {len(yolo)} tools, identical to --dangerously-skip-permissions (OK)')
          "

      - name: Test unknown method returns error
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n{"jsonrpc":"2.0","id":2,"method":"nonexistent/method","params":{}}\n' \
            | .build/release/mirroir-mcp 2>/dev/null \
            | python3 -c "
          import sys, json
          lines = sys.stdin.readlines()
          resp = json.loads(lines[1])
          assert 'error' in resp, f'Expected error response, got: {resp}'
          assert resp['error']['code'] != 0, 'Error code should be non-zero'
          print(f'Unknown method error: code={resp[\"error\"][\"code\"]}')
          "

      - name: Test invalid JSON is handled
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\nthis is not json\n' \
            | .build/release/mirroir-mcp 2>/dev/null \
            | python3 -c "
          import sys, json
          lines = sys.stdin.readlines()
          # First line should be valid initialize response
          init_resp = json.loads(lines[0])
          assert 'result' in init_resp, 'Initialize should succeed'
          # Second line should be a parse error (-32700)
          if len(lines) > 1:
              err = json.loads(lines[1])
              assert 'error' in err, f'Expected error for bad JSON, got: {err}'
              print(f'Invalid JSON error: code={err[\"error\"][\"code\"]}')
          else:
              print('Server dropped invalid JSON (acceptable)')
          "

  # The install path most people take: a machine with no embacle-ffi. Every
  # other job installs it first, so without this one the source build is never
  # link-checked the way a new user experiences it — which is how issue #38
  # shipped. Deliberately does NOT install embacle: absence is the test.
  build-without-embacle:
    name: Build without embacle-ffi
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The canary APP.md tests read ../mirroir-skills like the primary build
      # job does — absence of embacle is the test here, not absence of skills.
      - name: Clone skills repo
        run: |
          git clone https://github.com/jfarcand/mirroir-skills.git ../mirroir-skills
          mkdir -p .mirroir-mcp
          ln -s "$(cd ../mirroir-skills && pwd)" .mirroir-mcp/skills

      - name: Confirm the runner really has no embacle-ffi
        run: |
          set -euo pipefail
          for lib in /opt/homebrew/opt/embacle-ffi/lib/libembacle.a \
                     /opt/homebrew/lib/libembacle.a \
                     /usr/local/opt/embacle-ffi/lib/libembacle.a \
                     /usr/local/lib/libembacle.a; do
            if [ -f "$lib" ]; then
              echo "::error::$lib exists — this job must run on a machine without embacle"
              exit 1
            fi
          done
          echo "no libembacle.a anywhere — this is a clean machine"

      - name: Build (release) — must link without embacle
        run: swift build -c release

      - name: Binary runs and falls back to Apple Vision OCR
        run: |
          set -euo pipefail
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"check_health","arguments":{}}}\n' \
            | .build/release/mirroir-mcp 2>/dev/null \
            | python3 -c "
          import sys, json
          lines = [json.loads(l) for l in sys.stdin if l.strip()]
          init = next(m for m in lines if m['id'] == 1)
          assert init['result']['serverInfo']['name'] == 'mirroir-mcp', init
          health = next(m for m in lines if m['id'] == 2)
          text = health['result']['content'][0]['text']
          # OCR is the documented fallback when embacle is absent, so it must work.
          assert 'Text recognition working' in text, f'OCR unavailable without embacle:\n{text}'
          print('runs without embacle, OCR works')
          "

      - name: Unit tests still pass on the stub path
        timeout-minutes: 20
        run: swift test --skip IntegrationTests --disable-swift-testing
