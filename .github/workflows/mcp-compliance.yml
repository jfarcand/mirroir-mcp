# Triggered on changes to Sources/mirroir-mcp, Sources/HelperLib, MCPServerTests,
# MCPProtocolTests, ensure-mcp-compliance.sh, or this file. Manual via workflow_dispatch.
name: MCP Compliance

on:
  push:
    # Every branch, not just main: this repo squash-merges locally and opens no
    # pull requests of its own, so a feature branch has no other way to reach
    # this gate before it lands. The removed glob list could not match the
    # branch names actually used here (feat/..., fix/...) in any case — and
    # 'feature/*' would not have matched a nested name even with that prefix.
    # This workflow names no `tags`, so omitting `branches` means every branch.
    paths:
      - 'Sources/mirroir-mcp/**'
      - 'Sources/HelperLib/**'
      - 'Tests/MCPServerTests/**'
      - 'Tests/HelperLibTests/MCPProtocolTests.swift'
      - 'scripts/ci/ensure-mcp-compliance.sh'
      - 'scripts/ci/mcp-modern-conformance.py'
      - 'scripts/ci/mcp-schema-2026-07-28.json'
      - 'scripts/package-fake-app.sh'
      - 'Resources/**'
      - '.github/actions/setup-embacle/**'
      - '.github/actions/setup-fake-mirroring/**'
      - '.github/workflows/mcp-compliance.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Sources/mirroir-mcp/**'
      - 'Sources/HelperLib/**'
      - 'Tests/MCPServerTests/**'
      - 'Tests/HelperLibTests/MCPProtocolTests.swift'
      - 'scripts/ci/ensure-mcp-compliance.sh'
      - 'scripts/ci/mcp-modern-conformance.py'
      - 'scripts/ci/mcp-schema-2026-07-28.json'
      - 'scripts/package-fake-app.sh'
      - 'Resources/**'
      - '.github/actions/setup-embacle/**'
      - '.github/actions/setup-fake-mirroring/**'
      - '.github/workflows/mcp-compliance.yml'
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR — never on main or a tag,
# where each commit keeps its own complete run.
concurrency:
  # On main every commit keeps its own run: a third push must not replace a queued second one.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  mcp-compliance:
    name: MCP Protocol Compliance
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-embacle

      - name: Clone skills repo
        run: |
          git clone https://github.com/jfarcand/mirroir-skills.git ../mirroir-skills
          mkdir -p .mirroir-mcp
          ln -s "$(cd ../mirroir-skills && pwd)" .mirroir-mcp/skills

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Validates modern-revision results against the specification's schema.
      - name: Install schema validator
        run: pip install jsonschema

      - name: Build release binary
        run: swift build -c release

      - name: Verify binary exists
        run: |
          test -x .build/release/mirroir-mcp || { echo "Binary not found"; exit 1; }
          file .build/release/mirroir-mcp

      # Both eras: server/discover leads with the newest (stateless) revision,
      # and initialize negotiates the newest initialize-era one.
      - name: Validate MCP protocol versions
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"initialize","params":{}}' \
            | .build/release/mirroir-mcp 2>/dev/null \
            | python3 -c "
          import sys, json
          discover = json.loads(sys.stdin.readline())
          initialize = json.loads(sys.stdin.readline())
          versions = discover['result']['supportedVersions']
          assert versions[0] == '2026-07-28', f'server/discover must lead with 2026-07-28 (latest), got: {versions}'
          legacy = initialize['result']['protocolVersion']
          assert legacy == '2025-11-25', f'initialize must negotiate 2025-11-25 (newest initialize-era), got: {legacy}'
          print(f'MCP protocol versions: {versions}; initialize negotiates {legacy}')
          "

      - name: Run MCP compliance validation
        run: ./scripts/ci/ensure-mcp-compliance.sh

      - name: Run unit tests (XCTest)
        timeout-minutes: 15
        run: scripts/unit-tests.sh xctest

      - name: Run unit tests (Swift Testing)
        timeout-minutes: 5
        run: scripts/unit-tests.sh swift-testing

      - uses: ./.github/actions/setup-fake-mirroring
      - name: Integration tests (FakeMirroring)
        env:
          MIRROIR_BUNDLE_ID: com.jfarcand.FakeMirroring
        run: swift test --filter IntegrationTests
