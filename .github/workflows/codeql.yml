name: CodeQL

on:
  push:
    # Every branch, not just main: this repo squash-merges locally and opens no
    # pull requests of its own, so a feature branch has no other way to reach
    # CodeQL before it lands. Tags are excluded — a release tag points at a
    # commit main has already analyzed, and a duplicate macOS run would compete
    # with release.yml for the small macOS pool at exactly the wrong moment.
    tags-ignore: ['**']
    # Paths filters are workflow-scoped, not per-job: any match starts both
    # language lanes, so a JS-only change still pays for the Swift analysis.
    paths:
      - '**.swift'
      - 'Package.swift'
      - 'Package.resolved'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/codeql.yml'
      - '.github/actions/setup-embacle/**'
  pull_request:
    branches: [main]
    paths:
      - '**.swift'
      - 'Package.swift'
      - 'Package.resolved'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/codeql.yml'
      - '.github/actions/setup-embacle/**'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

# Cancel superseded runs on the same branch / PR to save runner-minutes.
concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-swift:
    name: Analyze Swift
    runs-on: macos-15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-embacle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build
        run: swift build -c release --arch arm64

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  analyze-js:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  analyze-actions:
    name: Analyze Actions
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
