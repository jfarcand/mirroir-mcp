name: CodeQL

on:
  push:
    # Every branch, not just main: this repo squash-merges locally and opens no
    # pull requests of its own, so a feature branch has no other way to reach
    # CodeQL before it lands. Tags are excluded — a release tag points at a
    # commit main has already analyzed, and a duplicate macOS run would compete
    # with release.yml for the small macOS pool at exactly the wrong moment.
    #
    # The branch filter is required alongside the tag filter: a push trigger
    # that names only `tags-ignore` fires on no branch push at all. Dependabot
    # is excluded because its PR already runs the pull_request lane below.
    branches-ignore: ['dependabot/**']
    tags-ignore: ['**']
    # No `paths` here: one paths filter applies to main as well, and every
    # main push is analyzed. A feature-branch push runs the analysis only when
    # its own setup changed — the `changes` job below — so source changes on
    # a branch are analyzed once they land on main (and by the weekly
    # schedule), not on every branch push. The gate is workflow-wide, like a
    # paths filter: any match starts all three lanes. workflow_dispatch forces
    # a full run on any branch.
  pull_request:
    branches: [main]
    paths:
      - '**.swift'
      - 'Package.swift'
      - 'Package.resolved'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/codeql.yml'
      - '.github/actions/setup-embacle/**'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

# Cancel superseded runs on the same branch / PR to save runner-minutes —
# never on main, where each commit keeps its own complete analysis.
concurrency:
  # On main every commit keeps its own run: a third push must not replace a queued second one.
  group: codeql-${{ github.head_ref || github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: CodeQL setup changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: gate
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: >-
          bash scripts/ci/changed-paths.sh
          'Package.swift' 'Package.resolved' 'scripts/ci/changed-paths.sh'
          '.github/actions/setup-embacle/*' '.github/workflows/codeql.yml'

  analyze-swift:
    name: Analyze Swift
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-embacle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build
        run: swift build -c release --arch arm64

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  analyze-js:
    name: Analyze JavaScript/TypeScript
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  analyze-actions:
    name: Analyze Actions
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
