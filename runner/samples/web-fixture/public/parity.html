     the same data-test attributes, the same six lines. Only the prose differs.

     is what a `cross_surface.capture` scrapes into baselines/parity.web.txt,
     and baselines/parity.ios.txt is the same screen as an iPhone's OCR reads
     it. A run against the variant keeps every assertion green and moves the
     two surfaces apart. -->
