version: 1
name: "result-victoire"
description: |
  The Brawl Stars result screen after a 3v3 win (VICTOIRE), on the
  FakeMirroring fixture that opens on it. Waits for the universal QUITTER button, reads the outcome,
  and returns to the main menu — the steps of mirroir-skills' result-assert.
steps:
  - target: { kind: ios, app: "Brawl Stars Victoire" }
  - reset_app: "Brawl Stars Victoire"
  - launch: "Brawl Stars Victoire"
  - wait_for: "QUITTER"
  - assert_visible: "VICTOIRE"
  - tap: "QUITTER"
  - wait_for: "JOUER"
